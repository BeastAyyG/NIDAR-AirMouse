nidar_airmouse_mission:
  ros__parameters:
    auto_start: false
    simulation_mode: true
    takeoff_altitude: 2.5
    waypoint_acceptance: 0.8
    precheck_seconds: 3.0
    hold_seconds: 2.0
    land_timeout_seconds: 15.0
    geofence_x_min: -14.0
    geofence_x_max: 14.0
    geofence_y_min: -14.0
    geofence_y_max: 14.0
    geofence_z_min: -4.0
    geofence_z_max: 0.5
    # Collision-free corridor route through the south and north rooms.  The
    # intermediate x=0/y=0 corridor points keep the vehicle on the open side
    # of the horizontal and vertical wall segments.
    # PX4 local NED uses x=north/y=east while Gazebo uses x=east/y=north.
    # These waypoints therefore map to the open south corridor in the SDF:
    # Gazebo (0,-6) -> local (-6,0), then Gazebo (-7,-6) -> local (-6,-7).
    mission_waypoints: [-6.0, 0.0, -2.5, -6.0, -7.0, -2.5, -6.0, 0.0, -2.5, -12.0, 0.0, -2.5, 0.0, 0.0, -2.5]

nidar_airmouse_survivor_localizer:
  ros__parameters:
    map_origin_x: 0.0
    map_origin_y: 0.0
    grid_cell_size: 1.0
    min_observations: 2

nidar_airmouse_sim_survivor_detector:
  ros__parameters:
    detection_radius: 2.5
    # Marker positions converted from Gazebo ENU to PX4 local NED x/y.
    survivor_targets: [-12.0, -12.0, 0.5, -6.0, -7.0, 0.5, -12.0, 0.0, 0.5, -12.0, 12.0, 0.5, 12.0, -12.0, 0.5, 12.0, 12.0, 0.5]
