# ros_gz_bridge configuration: Gazebo Harmonic topics -> ROS 2 Humble.
#
# Used by:
#   ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=<this>
#   ros2 launch airmouse_sim sim_bringup.launch.py    (same config)
#   ros2 launch airmouse_sensors sensors.launch.py    (standalone bridge)
#
# gz sensor topics come from the airmouse_x500_rgbd model:
#   RGB-D sensor <topic>camera</topic>  -> /camera/image, /camera/depth_image,
#   /camera/camera_info, /camera/depth_camera_info, /camera/points
#   IMU sensor  <topic>imu</topic>      -> /imu
#
# All entries are one-way (GZ_TO_ROS): the autonomy stack never commands the
# simulated sensors.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# RGB colour image (roadmap topic name kept for perception/survivor nodes).
- ros_topic_name: "/camera/color/image_raw"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Depth image (32FC1 metres; gz rgbd_camera publishes metric depth).
- ros_topic_name: "/camera/depth/image_rect_raw"
  gz_topic_name: "/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Colour camera intrinsics.
- ros_topic_name: "/camera/color/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Depth camera intrinsics (same lens as colour, separate topic).
- ros_topic_name: "/camera/depth/camera_info"
  gz_topic_name: "/camera/depth_camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Organized point cloud generated by the rgbd_camera sensor.
- ros_topic_name: "/camera/depth/color/points"
  gz_topic_name: "/camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# IMU on base_link (200 Hz, gaussian noise).
- ros_topic_name: "/camera/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
