name: Validate AirMouse maze

on:
  push:
  pull_request:

jobs:
  validate-maze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SDF geometry and nominal route
        run: python tools/validate_maze.py
      - name: Run pure-Python unit tests
        run: |
          python -m pip install --quiet pytest
          PYTHONPATH=nidar_airmouse_ros python -m pytest nidar_airmouse_ros/tests -q
      - name: Run grid + safety smoke check
        run: PYTHONPATH=nidar_airmouse_ros python -m nidar_airmouse_sim.sim_smoke
      - name: Run headless mission walk (accurate)
        run: PYTHONPATH=nidar_airmouse_ros python tools/headless_mission_smoke.py --profile accurate --quiet
      - name: Run headless mission walk (fast)
        run: PYTHONPATH=nidar_airmouse_ros python tools/headless_mission_smoke.py --profile fast --quiet
